import:
  - "~/.config/colors.yaml"
  - "~/.config/fonts.yaml"
live_config_reload: true

cursor:
  unfocused_hollow: false

  style:
    blinking: "On"
    shape: "Block"

env:
  TERM: "alacritty"
  WINIT_X11_SCALE_FACTOR: "1.0"

window:
  decorations: "buttonless"
  dynamic_title: true
  opacity: 1.0
  startup_mode: "Windowed"

  dimensions:
    columns: 82
    lines: 25

  padding:
    x: 20
    y: 20
